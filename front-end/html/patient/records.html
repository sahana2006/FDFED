<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEDBITS - Medical Records</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/patient/global.css">
  <link rel="stylesheet" href="../../css/components/p_sidebar.css">
  <link rel="stylesheet" href="../../css/components/p_navbar.css">
  <link rel="stylesheet" href="../../css/patient/records-profile-feedback.css">
</head>
<body>

<div id="sidebarMount"></div>

<div class="main-wrap">
  <div id="navbarMount"></div>

  <main class="content">
    <div class="stats-row">
      <div class="stat-card"><div class="stat-num" id="stat-total">0</div><div class="stat-label">Total Records</div></div>
      <div class="stat-card"><div class="stat-num" id="stat-consults">0</div><div class="stat-label">Consultations</div></div>
      <div class="stat-card"><div class="stat-num" id="stat-labs">0</div><div class="stat-label">Lab Tests & Reports</div></div>
    </div>

    <div class="card">
      <div class="section-header">
        <div class="section-title">Medical Records</div>
      </div>

      <div id="recordsEmptyState" class="text-muted" style="display:none">No medical records found.</div>

      <div id="consultationSection" class="mt-20">
        <div class="section-title" style="margin-bottom:12px">Consultation</div>
        <div id="consultationList"></div>
      </div>

      <div id="treatmentSection" class="mt-20">
        <div class="section-title" style="margin-bottom:12px">Treatment</div>
        <div id="treatmentList"></div>
      </div>

      <!-- Lab Test Requests Section -->
      <div id="labRequestsSection" class="mt-20">
        <div class="section-title" style="margin-bottom:12px">Lab Test Requests</div>
        <div id="labRequestsList"></div>
      </div>

      <!-- Completed Lab Reports Section -->
      <div id="labSection" class="mt-20">
        <div class="section-title" style="margin-bottom:12px">Completed Lab Reports</div>
        <div id="labList"></div>
      </div>
    </div>
  </main>
</div>

<template id="tpl-rec-card">
  <div class="rec-card">
    <div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
        <div class="rec-title"></div>
        <span class="badge rec-badge"></span>
      </div>
      <div class="rec-meta rec-meta-doc"></div>
      <div class="rec-notes rec-primary-text" style="margin-top:8px"></div>
      <div class="rec-prescription rec-medicines" style="margin-top:8px;display:none"></div>
      <div class="rec-notes rec-followup" style="margin-top:8px;display:none"></div>
    </div>
  </div>
</template>

<!-- Patient Lab Request Details Modal -->
<div class="modal-overlay" id="patientRequestDetailModal" aria-hidden="true" style="position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px;">
  <div class="card" style="background:#fff;border-radius:12px;width:100%;max-width:620px;max-height:90vh;overflow-y:auto;box-shadow:0 8px 30px rgba(0,0,0,.15);padding:0;margin:auto;">
    <div style="padding:18px 24px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;">
      <h3 style="font-family:'Sora',sans-serif;font-size:1.1rem;font-weight:700;margin:0;">Lab Test Request Details</h3>
      <button type="button" id="closePatientRequestDetailModal" style="font-size:1.4rem;border:none;background:none;cursor:pointer;color:#64748b;line-height:1;">&times;</button>
    </div>
    <div id="patientRequestDetailModalBody" style="padding:24px;"></div>
    <div style="padding:16px 24px;border-top:1px solid #e2e8f0;display:flex;justify-content:flex-end;gap:12px;background:#f8fafc;border-bottom-left-radius:12px;border-bottom-right-radius:12px;">
      <button type="button" class="btn btn-outline" id="dismissPatientRequestDetailModal">Close</button>
      <button type="button" class="btn btn-primary" id="btnModalViewReportFromRequest" style="display:none;">View Lab Report</button>
    </div>
  </div>
</div>

<!-- Patient Lab Report Details Modal -->
<div class="modal-overlay" id="patientReportModal" aria-hidden="true" style="position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px;">
  <div class="card" style="background:#fff;border-radius:12px;width:100%;max-width:680px;max-height:90vh;overflow-y:auto;box-shadow:0 8px 30px rgba(0,0,0,.15);padding:0;margin:auto;">
    <div style="padding:18px 24px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;">
      <h3 style="font-family:'Sora',sans-serif;font-size:1.1rem;font-weight:700;margin:0;">Diagnostic Lab Report</h3>
      <button type="button" id="closePatientReportModal" style="font-size:1.4rem;border:none;background:none;cursor:pointer;color:#64748b;line-height:1;">&times;</button>
    </div>
    <div id="patientReportModalBody" style="padding:24px;"></div>
    <div style="padding:16px 24px;border-top:1px solid #e2e8f0;display:flex;justify-content:flex-end;gap:12px;background:#f8fafc;border-bottom-left-radius:12px;border-bottom-right-radius:12px;">
      <button type="button" class="btn btn-outline" id="dismissPatientReportModal">Close</button>
      <button type="button" class="btn btn-primary" id="printPatientReportBtn">Print Report</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="../../js/patient/utils.js"></script>
<script src="../../js/patient/components.js"></script>
<script src="../../js/patient/records.js"></script>
<script>
  (async () => {
    await loadComponents('records', 'Medical Records');
    updateTopbarUser();
    try {
      await initializeMedicalRecordsPage();
    } catch (_error) {
      showToast('Unable to load medical records from backend', 'error');
    }
  })();
</script>
</body>
</html>
